services:
  postgres:
    image: postgres:17
    container_name: basecamp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: basecamp
      POSTGRES_PASSWORD: basecamp
      POSTGRES_DB: basecamp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: